name: proximity_app
description: Proximity — Campus Attendance System. Single app, Prof + Student modes.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  proximity_protocol:
    path: ../../packages/protocol
  proximity_ble:
    path: ../../packages/ble
  proximity_face:
    path: ../../packages/face
  proximity_transport:
    path: ../../packages/transport
  proximity_storage:
    path: ../../packages/storage
  # Firebase via FlutterFire (project: proximity-attendence).
  # Auth + Firestore: sign-in on Android/iOS/macOS; Windows/Linux builds
  # run offline-only (see AuthService.available + main fail-soft).
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  google_sign_in: ^6.2.2
  path_provider: ^2.1.4
  ed25519_edwards: ^0.3.1
  camera: ^0.12.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  universal_ble: ^2.2.0
  permission_handler: ^13.0.1
  tflite_flutter: ^0.12.1
  image: ^4.9.2
  share_plus: ^12.0.2
  wakelock_plus: ^1.5.2
  # Web records build only (browser download for CSV exports).
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.25.0

# macOS Google Sign-In keychain regression: native GoogleSignIn 7.1+ / 8.x
# throws "keychain error" on macOS even with correct entitlements
# (google/GoogleSignIn-iOS#165, #492 — 7.0.0 is the last good one).
# Pin the iOS/macOS federated impl until upstream fixes it.
dependency_overrides:
  google_sign_in_ios: 5.7.5

flutter:
  uses-material-design: true
  assets:
    - assets/models/
