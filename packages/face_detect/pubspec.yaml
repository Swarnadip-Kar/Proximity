name: proximity_face_detect
description: First-party face-presence detector — Apple Vision on iOS/macOS, ML Kit on Android. No third-party pods, so simulator stays arm64.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.4.0
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: org.iitbhilai.proximity.face_detect
        pluginClass: ProximityFaceDetectPlugin
      ios:
        pluginClass: ProximityFaceDetectPlugin
