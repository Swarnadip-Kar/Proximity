# Proximity CI: Android APK + Windows + Linux desktop builds.
# Firebase config files are tracked in-repo (public identifiers, standard
# FlutterFire practice), so no secrets are needed. Release signing
# (keystore / App Store / MSIX) is intentionally out — debug/dev builds only.
name: build

on:
  push:
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/proximity_app

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter analyze
      - run: flutter test
      - name: protocol + transport + ble unit tests
        run: |
          for p in protocol transport ble face_detect; do
            (cd ../../packages/$p && (flutter test 2>/dev/null || dart test))
          done

  android:
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: proximity-android-apk
          path: apps/proximity_app/build/app/outputs/flutter-apk/app-debug.apk

  windows:
    runs-on: windows-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --debug
      - uses: actions/upload-artifact@v4
        with:
          name: proximity-windows
          path: apps/proximity_app/build/windows/x64/runner/Debug/

  linux:
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop + Bluetooth deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libbluetooth-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --debug
      - uses: actions/upload-artifact@v4
        with:
          name: proximity-linux
          path: apps/proximity_app/build/linux/x64/debug/bundle/
