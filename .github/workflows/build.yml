# Proximity CI: Android APK + Windows + Linux + macOS desktop builds,
# iOS (unsigned) + web (records-only) compile gates.
# Firebase config files are tracked in-repo (public identifiers, standard
# FlutterFire practice), so no secrets are needed. Release signing
# (keystore / App Store / MSIX) is intentionally out — debug/dev builds only.
name: build

on:
  push:
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/proximity_app

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter analyze
      - run: flutter test
      - name: protocol + transport + ble unit tests
        run: |
          for p in protocol transport ble; do
            (cd ../../packages/$p && (flutter test 2>/dev/null || dart test))
          done

  android:
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # compileSdk 37 (Android 17, released June 2026; required by
      # permission_handler_android, which declares `compileSdk = 37` in its
      # own build script) is newer than the cmdline-tools pinned on the
      # runner image, whose package list has no `platforms;android-37`.
      # Without the platform, javac compiles against an empty android.jar
      # (`package android.content does not exist` across plugin Java).
      # Refresh cmdline-tools first so the platform package is visible,
      # then install it — compileSdk stays at the plugin-required 37.
      - name: Install Android API 37 platform (compileSdk 37)
        run: |
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses > /dev/null 2>&1 || true
          "$SDK" --install "cmdline-tools;latest" > /dev/null
          LATEST="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/ | sort -V | tail -1)/bin/sdkmanager"
          yes | "$LATEST" --licenses > /dev/null 2>&1 || true
          "$LATEST" "platforms;android-37"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: proximity-android-apk
          path: apps/proximity_app/build/app/outputs/flutter-apk/app-debug.apk

  windows:
    runs-on: windows-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      # windows-latest ships CMake 4.x, which removed compatibility with
      # `cmake_minimum_required` < 3.5 — the Firebase C++ SDK bundled with
      # firebase_core still declares an older minimum and configure fails
      # (`Compatibility with CMake < 3.5 has been removed`). Pin CMake 3.x;
      # upgrading Firebase to a re-declared C++ SDK is separate work.
      # NOTE: choco PATH changes are invisible to later steps (the runner
      # process env is captured at startup), so the 3.x bin dir is
      # explicitly prepended via GITHUB_PATH — without this the build step
      # still resolves the preinstalled CMake 4.
      - name: Pin CMake 3.x (Firebase C++ SDK compat)
        run: |
          choco install cmake --version 3.31.6 --allow-downgrade -y
          echo 'C:\Program Files\CMake\bin' >> $env:GITHUB_PATH
      - name: Verify CMake 3.x wins on PATH
        run: cmake --version
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --debug
      - uses: actions/upload-artifact@v4
        with:
          name: proximity-windows
          path: apps/proximity_app/build/windows/x64/runner/Debug/

  linux:
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop + Bluetooth deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libbluetooth-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --debug
      - uses: actions/upload-artifact@v4
        with:
          name: proximity-linux
          path: apps/proximity_app/build/linux/x64/debug/bundle/

  macos:
    runs-on: macos-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Unsigned compile+link gate: `flutter build macos` codesigns with the
      # bundle id and fails on a clean runner (no provisioning profiles).
      # --config-only generates the Xcode project (incl. pod install);
      # xcodebuild with CODE_SIGNING_ALLOWED=NO then compiles + links
      # everything (Dart, Swift/ObjC plugins, Firebase pods) with no certs.
      # Proven locally: full BUILD SUCCEEDED, same command.
      - run: flutter build macos --config-only
      - name: Build macOS app unsigned (compile gate, no certs)
        run: >
          xcodebuild -workspace macos/Runner.xcworkspace
          -scheme Runner -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath build/xcode-derived
          CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: proximity-macos
          path: apps/proximity_app/build/xcode-derived/Build/Products/Debug/proximity_app.app

  ios:
    runs-on: macos-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Unsigned compile gate only: --no-codesign needs no certificates and
      # produces an uninstallable .app, so there is deliberately no artifact
      # upload — the build itself is the gate (Dart + iOS plugin code must
      # compile; face/ML Kit are iOS-native here, unlike the macOS stubs).
      - run: flutter build ios --debug --no-codesign

  web:
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Records-only target: the ONLY job that compiles the
      # dart.library.html conditional-export variants (transport stubs,
      # BlueZ stub, net_if/file_saver web, face_verifier + pose_gate stubs).
      # `flutter analyze` resolves the native variants, so without this job
      # stub drift ships silently (it did: boundAddress/exemptFacePair/
      # clearFaceVectors/faceVecB64).
      - run: flutter build web
      - uses: actions/upload-artifact@v4
        with:
          name: proximity-web
          path: apps/proximity_app/build/web
