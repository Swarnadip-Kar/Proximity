# Proximity CI: Android APK + Windows + Linux + macOS desktop builds,
# iOS (unsigned) + web (records-only) compile gates.
# Firebase config files are tracked in-repo (public identifiers, standard
# FlutterFire practice), so no secrets are needed. Release signing
# (keystore / App Store / MSIX) is intentionally out — debug/dev builds only.
name: build

on:
  push:
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/proximity_app

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter analyze
      - run: flutter test
      - name: protocol + transport + ble unit tests
        run: |
          for p in protocol transport ble; do
            (cd ../../packages/$p && (flutter test 2>/dev/null || dart test))
          done

  android:
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # The app compiles against `flutter.compileSdkVersion` (36) — ensure
      # the platform is present even if a future runner image drops it.
      # (History: compileSdk 37 was tried and reverted — Google has not
      # published platforms;android-37, and permission_handler is pinned
      # to 12.x until it ships. See the pubspec pin note.)
      - name: Ensure Android API 36 platform (compileSdk 36)
        run: |
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses > /dev/null 2>&1 || true
          "$SDK" "platforms;android-36"
          ls "$ANDROID_HOME/platforms"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: proximity-android-apk
          path: apps/proximity_app/build/app/outputs/flutter-apk/app-debug.apk

  windows:
    # Pinned to windows-2022, not windows-latest: the win25-vs2026 image
    # ships VS2026 whose BUNDLED CMake is 4.x, and flutter resolves cmake
    # via the VS install — not PATH, so no PATH-level CMake 3.x pin can
    # redirect it (verified: PATH cmake 3.31.6, build still used 4.x).
    # CMake 4 removed `cmake_minimum_required` < 3.5 compat, which the
    # Firebase C++ SDK bundled with firebase_core still declares.
    # windows-2022 (VS2022, CMake 3.x) configures it fine.
    runs-on: windows-2022
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --debug
      - uses: actions/upload-artifact@v4
        with:
          name: proximity-windows
          path: apps/proximity_app/build/windows/x64/runner/Debug/

  linux:
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop + Bluetooth deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libbluetooth-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --debug
      - uses: actions/upload-artifact@v4
        with:
          name: proximity-linux
          path: apps/proximity_app/build/linux/x64/debug/bundle/

  macos:
    runs-on: macos-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Unsigned compile+link gate: `flutter build macos` codesigns with the
      # bundle id and fails on a clean runner (no provisioning profiles).
      # --config-only generates the Xcode project (incl. pod install);
      # xcodebuild with CODE_SIGNING_ALLOWED=NO then compiles + links
      # everything (Dart, Swift/ObjC plugins, Firebase pods) with no certs.
      # Proven locally: full BUILD SUCCEEDED, same command.
      - run: flutter build macos --config-only
      - name: Build macOS app unsigned (compile gate, no certs)
        run: >
          xcodebuild -workspace macos/Runner.xcworkspace
          -scheme Runner -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath build/xcode-derived
          CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: proximity-macos
          path: apps/proximity_app/build/xcode-derived/Build/Products/Debug/proximity_app.app

  ios:
    runs-on: macos-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Unsigned compile gate only: --no-codesign needs no certificates and
      # produces an uninstallable .app, so there is deliberately no artifact
      # upload — the build itself is the gate (Dart + iOS plugin code must
      # compile; face/ML Kit are iOS-native here, unlike the macOS stubs).
      - run: flutter build ios --debug --no-codesign

  web:
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Records-only target: the ONLY job that compiles the
      # dart.library.html conditional-export variants (transport stubs,
      # BlueZ stub, net_if/file_saver web, face_verifier + pose_gate stubs).
      # `flutter analyze` resolves the native variants, so without this job
      # stub drift ships silently (it did: boundAddress/exemptFacePair/
      # clearFaceVectors/faceVecB64).
      - run: flutter build web
      - uses: actions/upload-artifact@v4
        with:
          name: proximity-web
          path: apps/proximity_app/build/web
